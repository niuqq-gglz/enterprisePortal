<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440" />
  <title>登录 · 企业员工门户</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --ink: #0f172a;
      --body: #334155;
      --muted: #64748b;
      --faint: #94a3b8;
      --line: #e2e8f0;
      --blue: #1d4ed8;
      --blue-soft: #eff6ff;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.04), 0 6px 16px rgba(15, 23, 42, 0.03);
      --login: linear-gradient(100deg, #24143f 0%, #5c2a78 46%, #ef6b3a 100%);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #eef2f6;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }
    .frame {
      width: 1440px;
      margin: 0 auto;
      background: var(--bg);
      min-height: 100vh;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.05);
    }
    .login-btn {
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      background: var(--login);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
      text-decoration: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 8px 16px rgba(90, 30, 70, 0.18);
      cursor: pointer;
      font-family: inherit;
    }
    .login-btn:hover { filter: brightness(1.08); }
    .login-btn.wide { width: 100%; height: 46px; font-size: 15px; margin-top: 8px; }
    main {
      width: 440px;
      margin: 0 auto;
      padding: 88px 0 64px;
    }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 32px 32px 28px;
    }
    h1 {
      margin: 0 0 24px;
      font-size: 28px;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }
    label {
      display: block;
      margin-bottom: 14px;
      color: var(--body);
      font-size: 13px;
      font-weight: 600;
    }
    input {
      display: block;
      width: 100%;
      height: 46px;
      margin-top: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 0 14px;
      font: inherit;
      font-size: 14px;
      font-weight: 450;
      color: var(--ink);
      background: #fff;
    }
    input:focus {
      outline: 2px solid #bfdbfe;
      border-color: var(--blue);
    }
    .code-row { display: flex; gap: 8px; margin-top: 8px; }
    .code-row input { margin-top: 0; }
    .code-row button {
      flex: 0 0 auto;
      height: 46px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #f8fafc;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .code-row button:hover { background: #f1f5f9; }
    .note, .error { min-height: 18px; margin: 0 0 8px; font-size: 12px; line-height: 1.5; }
    .note { color: var(--muted); }
    .error { color: #b91c1c; }
    .back {
      display: inline-block;
      margin-top: 16px;
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
    }
    .back:hover { color: var(--ink); }
  </style>
</head>
<body>
  <div class="frame">
    <main>
      <form class="card" id="login-form">
        <h1>使用企业邮箱登录</h1>
        <label>企业邮箱
          <input type="email" name="email" autocomplete="username" placeholder="name@company.com" required />
        </label>
        <label>验证码
          <span class="code-row">
            <input name="code" inputmode="numeric" maxlength="6" placeholder="6 位验证码" autocomplete="one-time-code" />
            <button type="button" id="send-code">获取验证码</button>
          </span>
        </label>
        <p class="note" id="code-note">原型演示填写邮箱后即可登录。</p>
        <p class="error" id="form-error" role="alert"></p>
        <button class="login-btn wide" type="submit">登录</button>
        <a class="back" href="index.html">返回首页</a>
      </form>
    </main>
  </div>
  <script>
    const form = document.getElementById("login-form");
    const note = document.getElementById("code-note");
    const error = document.getElementById("form-error");

    function validEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    document.getElementById("send-code").addEventListener("click", () => {
      const email = form.email.value.trim();
      error.textContent = "";
      if (!validEmail(email)) {
        note.textContent = "请先填写有效的企业邮箱。";
        return;
      }
      note.textContent = "验证码已发到 " + email + "。原型演示可直接点击登录。";
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const email = form.email.value.trim();
      if (!validEmail(email)) {
        error.textContent = "请输入有效的企业邮箱。";
        return;
      }
      location.href = "homepage-mockup.html";
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>日历 · 企业员工门户</title>
  <script>
    if (new URLSearchParams(location.search).get("guest") === "1") {
      document.documentElement.dataset.guest = "1";
    }
  </script>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --ink: #0f172a;
      --body: #334155;
      --muted: #64748b;
      --line: #e2e8f0;
      --blue: #1d4ed8;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .frame { position: relative; min-height: 100vh; }
    .account {
      position: absolute;
      top: 28px;
      right: 40px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--muted);
      font-size: 14px;
    }
    .leave { color: var(--muted); font-size: 14px; text-decoration: none; }
    .leave:hover { color: var(--ink); }
    .account-out { display: none; }
    .enter {
      height: 32px;
      display: inline-flex;
      align-items: center;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }
    html[data-guest="1"] .account-in { display: none; }
    html[data-guest="1"] .account-out { display: flex; }
    main {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
      padding: 72px 0 64px;
    }
    .crumbs { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .crumbs a { color: var(--muted); text-decoration: none; }
    .crumbs a:hover, .crumbs .cur { color: var(--ink); }
    .page-head { margin-bottom: 20px; }
    .page-head h1 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: -0.02em; }
    .page-head p { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 420px) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }
    .card-cal { padding: 16px 12px 14px; }
    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 4px 2px;
    }
    .cal-nav h2 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: -0.03em; }
    .cal-arrows { display: flex; gap: 2px; }
    .cal-arrows button {
      width: 28px; height: 28px; border: 0; background: transparent; border-radius: 8px;
      color: var(--muted); display: grid; place-items: center; padding: 0; cursor: pointer;
    }
    .cal-arrows button:hover { background: #f1f5f9; }
    .cal-arrows button:disabled { opacity: 0.3; cursor: default; }
    .cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    .cal-week span { text-align: center; font-size: 12px; color: #9aa3af; font-weight: 500; padding: 8px 0 4px; }
    .cal-week span.rest { color: #3b82f6; }
    .cal-grid { grid-auto-rows: 46px; }
    .day { position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 3px; min-width: 0; }
    .day .num {
      width: 24px; height: 22px; display: grid; place-items: center; border-radius: 7px;
      font-size: 15px; font-weight: 560; font-variant-numeric: tabular-nums; line-height: 1;
    }
    .day .sub {
      max-width: 100%; margin-top: 1px; padding: 0 1px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; font-size: 10px; line-height: 1.3; color: #9aa3af;
    }
    .day .sub.fest { color: #64748b; }
    .day.is-off .num, .day.is-weekend .num { color: #3b82f6; }
    .day.is-today .num { background: #2f7cf6; color: #fff; font-weight: 650; }
    .day.out .num, .day.out .sub, .day.out.is-off .num, .day.out.is-weekend .num { color: #c5ced8; }
    .day .mark { position: absolute; top: 0; right: 1px; font-size: 9px; font-weight: 650; line-height: 1; color: #5b93f5; }
    .day .mark.work { color: #f25c2a; }
    .day.out .mark { color: #c5ced8; }
    .holidays { padding: 18px 20px 8px; }
    .holidays h2 { margin: 0 0 8px; font-size: 16px; font-weight: 650; }
    .holiday {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0;
      border-top: 1px solid #f1f5f9;
    }
    .holiday strong { display: block; font-size: 14px; }
    .holiday span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .tag {
      flex: 0 0 auto;
      align-self: center;
      font-size: 12px;
      font-weight: 600;
      color: #1d4ed8;
      background: #eff6ff;
      border-radius: 999px;
      padding: 2px 8px;
    }
    .tag.work { color: #c2410c; background: #fff7ed; }
    @media (max-width: 800px) {
      .account { right: 20px; }
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="account account-in"><span>name@ggquanta.com</span><a class="leave" href="index.html">退出</a></div>
    <div class="account account-out"><a class="leave" href="register.html">注册</a><a class="enter" href="login.html">登录</a></div>
    <main>
      <nav class="crumbs" aria-label="面包屑">
        <a id="home-link" href="homepage-mockup.html">首页</a>
        <span aria-hidden="true">/</span>
        <span class="cur">日历</span>
      </nav>
      <div class="page-head">
        <h1>日历</h1>
        <p>查看公历、农历，以及节假日和调休安排。不含个人日程和会议。</p>
      </div>
      <div class="layout">
        <section class="card card-cal" aria-labelledby="cal-heading">
          <div class="cal-nav">
            <h2 id="cal-heading">10月</h2>
            <div class="cal-arrows">
              <button type="button" id="cal-prev" aria-label="上个月">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M8.5 3.5 5 7l3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button type="button" id="cal-next" aria-label="下个月">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M5.5 3.5 9 7l-3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>
          <div class="cal-week" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="rest">六</span><span class="rest">日</span></div>
          <div id="cal-grid" class="cal-grid" role="grid"></div>
        </section>
        <section class="card holidays" aria-labelledby="holiday-heading">
          <h2 id="holiday-heading">放假与调休</h2>
          <div class="holiday">
            <div><strong>中秋节</strong><span>2026年9月25日 – 9月27日</span></div>
            <span class="tag">放假</span>
          </div>
          <div class="holiday">
            <div><strong>国庆节</strong><span>2026年10月1日 – 10月7日</span></div>
            <span class="tag">放假</span>
          </div>
          <div class="holiday">
            <div><strong>国庆调休</strong><span>2026年9月20日、10月10日上班</span></div>
            <span class="tag work">上班</span>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="calendar.js"></script>
  <script>
    if (document.documentElement.dataset.guest === "1") {
      document.getElementById("home-link").href = "index.html";
    }
  </script>
</body>
</html>

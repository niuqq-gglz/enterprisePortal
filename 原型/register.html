<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440" />
  <title>注册 · 企业员工门户</title>
  <style>
    :root {
      --bg: #f8fafc;
      --ink: #0f172a;
      --body: #334155;
      --muted: #64748b;
      --line: #e2e8f0;
      --blue: #1d4ed8;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.04), 0 6px 16px rgba(15, 23, 42, 0.03);
      --login: linear-gradient(100deg, #24143f 0%, #5c2a78 46%, #ef6b3a 100%);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #eef2f6;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }
    .frame {
      width: 1440px;
      margin: 0 auto;
      background: var(--bg);
      min-height: 100vh;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.05);
    }
    .login-btn {
      height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-top: 8px;
      border: 0;
      border-radius: 999px;
      background: var(--login);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 8px 16px rgba(90, 30, 70, 0.18);
      font-family: inherit;
    }
    main { width: 440px; margin: 0 auto; padding: 72px 0 64px; }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 32px 32px 28px;
    }
    h1 { margin: 0 0 24px; font-size: 28px; letter-spacing: -0.03em; line-height: 1.2; }
    label { display: block; margin-bottom: 14px; color: var(--body); font-size: 13px; font-weight: 600; }
    input {
      display: block;
      width: 100%;
      height: 46px;
      margin-top: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 0 14px;
      font: inherit;
      font-size: 14px;
      color: var(--ink);
      background: #fff;
    }
    .code-row { display: flex; gap: 8px; margin-top: 8px; }
    .code-row input { margin-top: 0; }
    .code-row span {
      flex: 0 0 auto;
      height: 46px;
      display: inline-flex;
      align-items: center;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #f8fafc;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .altcha {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 46px;
      margin: 2px 0 16px;
      padding: 0 14px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      background: #f8fafc;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
    }
    .altcha .box {
      width: 18px;
      height: 18px;
      border: 1.5px solid #94a3b8;
      border-radius: 4px;
      background: #fff;
    }
    .hint { margin: 0 0 16px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .links { display: flex; justify-content: space-between; margin-top: 16px; }
    .links a { color: var(--muted); font-size: 13px; text-decoration: none; }
    .links a:hover { color: var(--ink); }
  </style>
</head>
<body>
  <div class="frame">
    <main>
      <form class="card">
        <h1>注册账号</h1>
        <label>企业邮箱
          <input type="email" placeholder="name@ggquanta.com" />
        </label>
        <label>邮箱验证码
          <span class="code-row">
            <input inputmode="numeric" maxlength="6" placeholder="6 位验证码" />
            <span>获取验证码</span>
          </span>
        </label>
        <label>密码
          <input type="password" placeholder="请设置密码" />
        </label>
        <label>确认密码
          <input type="password" placeholder="再次输入密码" />
        </label>
        <div class="altcha"><span class="box"></span>点击完成人机验证</div>
        <p class="hint">仅接受 @ggquanta.com<br />密码至少 8 位，须含字母、数字和特殊字符</p>
        <a class="login-btn" href="login.html">完成注册</a>
        <div class="links">
          <a href="index.html">返回首页</a>
          <a href="login.html">已有账号，去登录</a>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
